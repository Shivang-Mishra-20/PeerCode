version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: peercode_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-peercode_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-peercode_secret}
      POSTGRES_DB: ${POSTGRES_DB:-peercode_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: peercode_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
